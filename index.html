    <style>
      /* Boot splash that always renders, even before Tailwind/JS finish loading.
         Uses only built-in fonts and inline colors so it renders even on cold-cache CN networks. */
      html, body { margin: 0; padding: 0; }
      body { background: #F9F8F6; color: #2C2A26; }
      #boot-splash {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #F9F8F6 0%, #F2F0EB 100%);
        color: #2C2A26;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Georgia, "Playfair Display", "Times New Roman", serif;
        z-index: 9999;
        padding: 1.5rem;
        text-align: center;
      }
      #boot-splash[hidden] { display: none; }
      #boot-splash .boot-mark {
        font-size: 0.7rem;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #4A463F;
        opacity: 0.7;
        margin-bottom: 1.25rem;
      }
      #boot-splash .boot-title {
        font-size: clamp(2rem, 6vw, 3.5rem);
        letter-spacing: -0.02em;
        margin: 0 0 1.75rem 0;
        font-weight: 600;
      }
      #boot-splash .boot-title em { font-style: italic; font-weight: 400; }
      #boot-splash .boot-dots { display: inline-flex; gap: 0.5rem; }
      #boot-splash .boot-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2C2A26;
        opacity: 0.3;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot-splash .boot-dots span:nth-child(2) { animation-delay: 0.2s; }
      #boot-splash .boot-dots span:nth-child(3) { animation-delay: 0.4s; }
      #boot-slow-hint {
        margin-top: 2rem;
        max-width: 32rem;
        font-family: system-ui, -apple-system, "Segoe UI", "Inter", sans-serif;
        font-size: 0.875rem;
        color: #4A463F;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #boot-slow-hint[data-visible="true"] { opacity: 1; }
      #boot-error {
        margin-top: 2rem;
        max-width: 36rem;
        padding: 1.25rem 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", "Inter", sans-serif;
        font-size: 0.9rem;
        color: #7C2D12;
        background: rgba(254, 226, 226, 0.55);
        border: 1px solid rgba(252, 165, 165, 0.55);
        border-radius: 0.5rem;
        text-align: left;
      }
      #boot-error[hidden] { display: none; }
      #boot-error h2 {
        margin: 0 0 0.5rem 0;
        font-family: Georgia, serif;
        font-size: 1.1rem;
        color: #7C2D12;
      }
      #boot-error button {
        margin-top: 0.75rem;
        padding: 0.5rem 1.5rem;
        background: #2C2A26;
        color: #F9F8F6;
        border: none;
        border-radius: 9999px;
        font-family: Georgia, serif;
        cursor: pointer;
        font-size: 0.875rem;
      }
      #boot-error details {
        margin-top: 0.75rem;
        font-size: 0.75rem;
        color: #4A463F;
      }
      #boot-error details pre {
        margin-top: 0.5rem;
        max-height: 12rem;
        overflow: auto;
        padding: 0.5rem;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 0.25rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      @keyframes boot-pulse {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1); }
      }

      /* Rubbing mini-game embedded in the boot splash. Built with vanilla
         JS / SVG / canvas so it works before the React bundle finishes
         downloading on cold-cache networks. Hidden until the user clicks
         the discreet toggle that fades in 1.2s after first paint, so fast
         loads (where React mounts in <1s) never see it. */
      #boot-game-toggle {
        margin-top: 2.25rem;
        background: transparent;
        border: 1px solid #2C2A26;
        border-radius: 9999px;
        padding: 0.55rem 1.4rem;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #2C2A26;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease, background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      }
      #boot-game-toggle[data-visible="true"] { opacity: 0.85; pointer-events: auto; }
      #boot-game-toggle:hover { background: #2C2A26; color: #F9F8F6; opacity: 1; transform: translateY(-1px); }
      #boot-game-toggle[data-hidden="true"] { display: none; }
      #boot-game {
        display: none;
        margin-top: 1.75rem;
        flex-direction: column;
        align-items: center;
      }
      #boot-game[data-open="true"] {
        display: flex;
        animation: boot-game-in 0.45s ease-out;
      }
      #boot-game .bg-frame {
        position: relative;
        width: 240px;
        height: 240px;
        border: 1px solid #D1CCC0;
        background: linear-gradient(135deg, #F4F0E6 0%, #ECE3D1 60%, #E2D7C0 100%);
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      }
      #boot-game .bg-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 14%;
        box-sizing: border-box;
      }
      #boot-game .bg-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        touch-action: none;
        transition: opacity 0.7s ease;
      }
      #boot-game .bg-canvas[data-done="true"] { opacity: 0; pointer-events: none; }
      #boot-game .bg-meta {
        margin-top: 0.95rem;
        font-family: Georgia, "Playfair Display", serif;
        font-style: italic;
        font-size: 1rem;
        color: #2C2A26;
        opacity: 0.3;
        transition: opacity 0.7s ease;
        min-height: 22px;
      }
      #boot-game .bg-meta[data-done="true"] { opacity: 1; }
      #boot-game .bg-era {
        margin-top: 0.25rem;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.6rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #4A463F;
        opacity: 0;
        transition: opacity 0.7s ease;
        min-height: 12px;
      }
      #boot-game .bg-era[data-done="true"] { opacity: 0.7; }
      #boot-game .bg-controls {
        margin-top: 0.85rem;
        display: flex;
        gap: 1.4rem;
      }
      #boot-game .bg-controls button {
        background: transparent;
        border: none;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.62rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #4A463F;
        cursor: pointer;
        padding: 0.2rem 0.1rem;
        transition: color 0.2s ease;
      }
      #boot-game .bg-controls button:hover { color: #2C2A26; }
      #boot-game .bg-hint {
        margin-top: 0.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", "Inter", sans-serif;
        font-size: 0.7rem;
        color: #6E665A;
        max-width: 240px;
        text-align: center;
      }
      @keyframes boot-game-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-game-toggle,
        #boot-game,
        #boot-game .bg-canvas,
        #boot-game .bg-meta,
        #boot-game .bg-era {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>

        var revealTimer = setTimeout(function () {

        var ARTIFACTS = [

            { d: 'M50,34 C38,34 30,42 30,54 C30,66 38,74 50,74 C62,74 70,66 70,54 C70,42 62,34 50,34 Z', sw: 0.35 },

          ] },
          { id: 'folding-fan', title: '折扇', era: '东亚 · 17 世纪以降', paths: [
            { d: 'M50,88 L9,69 A45 45 0 0 1 91,69 L50,88 Z' },

            { d: 'M50,88 L65,46', sw: 0.4 }, { d: 'M50,88 L79,54', sw: 0.4 },
            { d: 'M49.2,87.2 L50.8,87.2 L50.8,88.8 L49.2,88.8 Z', fill: '#3C342A' }
          ] }
        ];

        var SVG_NS = 'http://www.w3.org/2000/svg';
        var state = { idx: -1, done: false, drawing: false, lastSample: 0, artifact: null };

        function pickArtifact() {
          if (ARTIFACTS.length === 1) return ARTIFACTS[0];
          var n;
          do { n = Math.floor(Math.random() * ARTIFACTS.length); } while (n === state.idx);
          state.idx = n;
          return ARTIFACTS[n];
        }

        function paintTexture(canvas) {
          var ctx = canvas.getContext('2d');
          if (!ctx) return;
          var w = canvas.width, h = canvas.height;
          ctx.globalCompositeOperation = 'source-over';
          var grad = ctx.createLinearGradient(0, 0, 0, h);
          grad.addColorStop(0, '#B0A492');
          grad.addColorStop(1, '#988C78');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
          try {
            var img = ctx.getImageData(0, 0, w, h);
            var d = img.data;
            for (var i = 0; i < d.length; i += 4) {
              var n = (Math.random() - 0.5) * 36;
              d[i] = Math.max(0, Math.min(255, d[i] + n));
              d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
              d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
            }
            ctx.putImageData(img, 0, 0);
          } catch (_) { /* canvas tainted: skip noise */ }
        }

        function loadArtifact() {
          var artifact = pickArtifact();
          state.artifact = artifact;
          state.done = false;
          state.lastSample = 0;
          var svg = document.querySelector('#boot-game .bg-svg');
          if (svg) {
            while (svg.firstChild) svg.removeChild(svg.firstChild);
            for (var i = 0; i < artifact.paths.length; i++) {
              var p = artifact.paths[i];
              var node = document.createElementNS(SVG_NS, 'path');
              node.setAttribute('d', p.d);
              node.setAttribute('stroke', '#3C342A');
              node.setAttribute('stroke-width', String(p.sw != null ? p.sw : 0.6));
              node.setAttribute('fill', p.fill || 'none');
              node.setAttribute('stroke-linecap', 'round');
              node.setAttribute('stroke-linejoin', 'round');
              svg.appendChild(node);
            }
          }
          var canvas = document.querySelector('#boot-game .bg-canvas');
          if (canvas) {
            paintTexture(canvas);
            canvas.removeAttribute('data-done');
          }
          var meta = document.querySelector('#boot-game .bg-meta');
          var era = document.querySelector('#boot-game .bg-era');
          if (meta) { meta.textContent = '———'; meta.removeAttribute('data-done'); }
          if (era) { era.textContent = ' '; era.removeAttribute('data-done'); }
        }

        function revealCompletely() {
          var canvas = document.querySelector('#boot-game .bg-canvas');
          if (!canvas) return;
          var ctx = canvas.getContext('2d');
          if (!ctx) return;
          ctx.globalCompositeOperation = 'destination-out';
          ctx.fillStyle = 'rgba(0,0,0,1)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.globalCompositeOperation = 'source-over';
          canvas.setAttribute('data-done', 'true');
          var meta = document.querySelector('#boot-game .bg-meta');
          var era = document.querySelector('#boot-game .bg-era');
          if (meta) { meta.textContent = state.artifact.title; meta.setAttribute('data-done', 'true'); }
          if (era) { era.textContent = state.artifact.era; era.setAttribute('data-done', 'true'); }
          state.done = true;
        }

        function erase(canvas, x, y) {
          if (state.done) return;
          var ctx = canvas.getContext('2d');
          if (!ctx) return;
          var r = 22;
          ctx.globalCompositeOperation = 'destination-out';
          var g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, 'rgba(0,0,0,1)');
          g.addColorStop(0.55, 'rgba(0,0,0,0.7)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
          var now = Date.now();
          if (now - state.lastSample > 150) {
            state.lastSample = now;
            try {
              var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
              var d = img.data;
              var t = 0, c = 0;
              for (var i = 3; i < d.length; i += 32) { t++; if (d[i] < 24) c++; }
              if (t > 0 && c / t >= 0.62) revealCompletely();
            } catch (_) { /* ignore sampling failure */ }
          }
        }

        function setupInteractions() {
          var canvas = document.querySelector('#boot-game .bg-canvas');
          if (!canvas) return;
          loadArtifact();
          function localXY(e) {
            var rect = canvas.getBoundingClientRect();
            return [
              ((e.clientX - rect.left) / rect.width) * canvas.width,
              ((e.clientY - rect.top) / rect.height) * canvas.height
            ];
          }
          canvas.addEventListener('pointerdown', function (e) {
            if (state.done) return;
            state.drawing = true;
            try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
            var p = localXY(e); erase(canvas, p[0], p[1]);
          });
          canvas.addEventListener('pointermove', function (e) {
            if (!state.drawing) return;
            var p = localXY(e); erase(canvas, p[0], p[1]);
          });
          function endDraw(e) {
            state.drawing = false;
            try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
          }
          canvas.addEventListener('pointerup', endDraw);
          canvas.addEventListener('pointercancel', endDraw);
          canvas.addEventListener('pointerleave', endDraw);

          var resetBtn = document.querySelector('#boot-game button[data-action="reset"]');
          var nextBtn = document.querySelector('#boot-game button[data-action="next"]');
          if (resetBtn) resetBtn.addEventListener('click', function () {
            paintTexture(canvas);
            canvas.removeAttribute('data-done');
            var meta = document.querySelector('#boot-game .bg-meta');
            var era = document.querySelector('#boot-game .bg-era');
            if (meta) { meta.textContent = '———'; meta.removeAttribute('data-done'); }
            if (era) { era.textContent = ' '; era.removeAttribute('data-done'); }
            state.done = false;
            state.lastSample = 0;
          });
          if (nextBtn) nextBtn.addEventListener('click', loadArtifact);
        }

        var toggle = document.getElementById('boot-game-toggle');
        if (toggle) {
          toggle.addEventListener('click', function () {
            clearTimeout(revealTimer);
            toggle.setAttribute('data-hidden', 'true');
            toggle.setAttribute('aria-expanded', 'true');
            var slowHint = document.getElementById('boot-slow-hint');
            if (slowHint) slowHint.style.display = 'none';
            var game = document.getElementById('boot-game');
            if (game) {
              game.setAttribute('data-open', 'true');
              setupInteractions();
            }
          });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
