          { id: 'philosopher-bust', title: '哲人胸像', era: '希腊罗马 · 大理石',
            path: 'M256 37.4c-28.1 0-50.9 21.3-50.9 59.9c0 29.8 12.9 58.3 12.9 58.3l15-18.5h12.6v-22.7H218V93.5h76v20.9h-27.6v22.7H279l15 18.5s12.9-28.5 12.9-58.3c0-38.6-22.8-59.9-50.9-59.9m-66.9 72.5c-1.3 8.7-1.9 17.8-1.9 27.2c0 64.2 30.8 106.4 68.8 106.4s68.8-42.2 68.8-106.4c0-9.4-.6-18.5-1.9-27.2c-2.8 28.3-13.7 52.6-13.7 52.6L298.1 187l-27-33.2h-30.2l-27 33.2l-11.1-24.5s-10.9-24.3-13.7-52.6m58.6 53.7h16.6v12.7h-16.6zm71 19.7v.2zm-145.5 5l-36.9 9.3L168 339.4h61.8l24-75.1c-34.7-1.2-66.9-28.9-80.6-76m165.6 0c-10.5 36.2-32 61-57.2 71L256 339.4h21.7l20.7-70.4l12 3.5l-19.6 66.9h16.9l36.4-125.8l12 3.5l-35.4 122.3H344l31.7-141.8zM197 360.6v94h18v-64h82v64h18v-94zm36 48v46h46v-46zm-69.3 64l-14 18h212.6l-14-18z' },
          { id: 'porcelain-vase', title: '瓷瓶', era: '中国 · 明清',
            path: 'M304 30c-32 64-22.35 180.063 0 208c42.406 53.007 80 80 80 128c0 32-16 80-48 112v16H176v-16c-32.002-31.995-48-80-48-112c0-48 37.594-74.993 80-128c22.35-27.937 32-144 0-208c48-16 48-16 96 0' }
        ];

        var SVG_NS = 'http://www.w3.org/2000/svg';
        var TILE_SIZE = 512 / 3;
        var TILES = [
          { id: 'r1c1', label: 'A', row: 0, col: 0, tone: '#2C2A26' },
          { id: 'r1c2', label: 'B', row: 0, col: 1, tone: '#34312C' },
          { id: 'r1c3', label: 'C', row: 0, col: 2, tone: '#3D3932' },
          { id: 'r2c1', label: 'D', row: 1, col: 0, tone: '#4A443C' },
          { id: 'r2c2', label: 'E', row: 1, col: 1, tone: '#524B42' },
          { id: 'r2c3', label: 'F', row: 1, col: 2, tone: '#5B5246' },
          { id: 'r3c1', label: 'G', row: 2, col: 0, tone: '#665D51' },
          { id: 'r3c2', label: 'H', row: 2, col: 1, tone: '#6E665A' },
          { id: 'r3c3', label: 'I', row: 2, col: 2, tone: '#746B5E' }
        ];
        var QUADRANTS = TILES.map(function (tile) { return tile.id; });
        var LABELS = {};
        var VIEWBOX = {};
        var TONES = {};
        TILES.forEach(function (tile) {
          var x = Number((tile.col * TILE_SIZE).toFixed(4));
          var y = Number((tile.row * TILE_SIZE).toFixed(4));
          var size = Number(TILE_SIZE.toFixed(4));
          LABELS[tile.id] = tile.label;
          VIEWBOX[tile.id] = [x, y, size, size].join(' ');
          TONES[tile.id] = tile.tone;
        });
        var state = { idx: -1, artifact: null, pieces: [], selected: null, done: false, streak: 0 };

        function pickArtifact() {
          if (ARTIFACTS.length === 1) return ARTIFACTS[0];
          var n;
          do { n = Math.floor(Math.random() * ARTIFACTS.length); } while (n === state.idx);
          state.idx = n;
          return ARTIFACTS[n];
        }

        function shuffle(items) {
          var next = items.slice();
          for (var i = next.length - 1; i > 0; i -= 1) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = next[i]; next[i] = next[j]; next[j] = t;
          }
          return next;
        }

        function freshPieces() {
          state.pieces = shuffle(QUADRANTS).map(function (id) {
            return { id: id, placed: false };
          });
          state.selected = null;
          state.done = false;
          state.streak = 0;
        }

        function fragment(artifact, quadrant, tone, ghost) {
          var svg = document.createElementNS(SVG_NS, 'svg');
          svg.setAttribute('viewBox', VIEWBOX[quadrant]);
          svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
          svg.setAttribute('class', 'bg-fragment');
          if (ghost) svg.setAttribute('data-ghost', 'true');
          var path = document.createElementNS(SVG_NS, 'path');
          path.setAttribute('d', artifact.path);
          path.setAttribute('fill', tone);
          svg.appendChild(path);
          return svg;
        }

        function render() {
          var frame = document.querySelector('#boot-game .bg-frame');
          var tray = document.querySelector('#boot-game .bg-tray');
          var meta = document.querySelector('#boot-game .bg-meta');
          var era = document.querySelector('#boot-game .bg-era');
          var hint = document.querySelector('#boot-game .bg-hint');
          if (!frame || !tray || !state.artifact) return;
          frame.textContent = '';
          tray.textContent = '';
          if (state.done) frame.setAttribute('data-done', 'true');
          else frame.removeAttribute('data-done');

          QUADRANTS.forEach(function (q) {
            var placed = state.pieces.some(function (p) { return p.id === q && p.placed; });
            var slot = document.createElement('button');
            slot.type = 'button';
            slot.className = 'bg-slot';
            slot.setAttribute('data-slot', q);
            if (state.selected === q) slot.setAttribute('data-active', 'true');
            slot.setAttribute('aria-label', '展柜位置 ' + LABELS[q]);
            slot.appendChild(fragment(state.artifact, q, placed ? '#2C2A26' : '#2C2A26', !placed));
            var label = document.createElement('span');
            label.className = 'bg-slot-label';
            label.textContent = LABELS[q];
            slot.appendChild(label);
            frame.appendChild(slot);
          });

          state.pieces.filter(function (p) { return !p.placed; }).forEach(function (p) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'bg-piece';
            btn.setAttribute('data-piece', p.id);
            if (state.selected === p.id) btn.setAttribute('data-selected', 'true');
            btn.setAttribute('aria-label', '碎片 ' + LABELS[p.id]);
            btn.appendChild(fragment(state.artifact, p.id, TONES[p.id], false));
            var label = document.createElement('span');
            label.className = 'bg-piece-label';
            label.textContent = LABELS[p.id];
            btn.appendChild(label);
            tray.appendChild(btn);
          });

          if (meta) {
            meta.textContent = state.done ? state.artifact.title : 'Archive Puzzle';
            if (state.done) meta.setAttribute('data-done', 'true');
            else meta.removeAttribute('data-done');
          }
          if (era) {
            era.textContent = state.done ? state.artifact.era : (state.pieces.filter(function (p) { return p.placed; }).length + '/' + QUADRANTS.length);
            if (state.done) era.setAttribute('data-done', 'true');
            else era.removeAttribute('data-done');
          }
          if (hint) {
            hint.textContent = state.done
              ? '展柜已合拢，可以换下一件藏品。'
              : (state.selected ? '碎片 ' + LABELS[state.selected] + ' 已取出。' : '把散落的藏品碎片放回展柜。');
          }
        }

        function loadArtifact() {
          state.artifact = pickArtifact();
          freshPieces();
          render();
        }

        function resetCurrent() {
          freshPieces();
          render();
        }

        function tryPlace(pieceId, slotId) {
          if (!pieceId || !slotId || state.done) return;
          if (pieceId !== slotId) {
            var wrong = document.querySelector('#boot-game [data-slot="' + slotId + '"]');
            if (wrong) {
              wrong.setAttribute('data-wrong', 'true');
              setTimeout(function () { wrong.removeAttribute('data-wrong'); }, 420);
            }
            state.streak = 0;
            return;
          }
          state.pieces = state.pieces.map(function (p) {
            return p.id === pieceId ? { id: p.id, placed: true } : p;
          });
          state.selected = null;
          state.streak += 1;
          state.done = state.pieces.every(function (p) { return p.placed; });
          var placedSlot = document.querySelector('#boot-game [data-slot="' + slotId + '"]');
          if (placedSlot) {
            placedSlot.setAttribute('data-just-placed', 'true');
            setTimeout(function () { placedSlot.removeAttribute('data-just-placed'); }, 400);
          }
          render();
        }

        function setupInteractions() {
          loadArtifact();
          var frame = document.querySelector('#boot-game .bg-frame');
          var tray = document.querySelector('#boot-game .bg-tray');
          if (tray) tray.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-piece]');
            if (!btn) return;
            state.selected = btn.getAttribute('data-piece');
            render();
          });
          if (frame) frame.addEventListener('click', function (e) {
            var slot = e.target.closest('[data-slot]');
            if (!slot) return;
            tryPlace(state.selected, slot.getAttribute('data-slot'));
          });

          var resetBtn = document.querySelector('#boot-game button[data-action="reset"]');
          var nextBtn = document.querySelector('#boot-game button[data-action="next"]');
          if (resetBtn) resetBtn.addEventListener('click', resetCurrent);
          if (nextBtn) nextBtn.addEventListener('click', loadArtifact);
        }

        var toggle = document.getElementById('boot-game-toggle');
        if (toggle) {
          toggle.addEventListener('click', function () {
            clearTimeout(revealTimer);
            toggle.setAttribute('data-hidden', 'true');
            toggle.setAttribute('aria-expanded', 'true');
            var slowHint = document.getElementById('boot-slow-hint');
            if (slowHint) slowHint.style.display = 'none';
            var game = document.getElementById('boot-game');
            if (game) {
              game.setAttribute('data-open', 'true');
              setupInteractions();
            }
          });
        }
      })();
    </script>
