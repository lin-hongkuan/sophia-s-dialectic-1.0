<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <title>Sophia's Dialectic</title>
    <link rel="preconnect" href="https://api.linhongkuan.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.linhongkuan.com">
    <script>
      window.__bootStart = Date.now();
      window.__bootSlowTimer = setTimeout(function () {
        var hint = document.getElementById('boot-slow-hint');
        if (hint) hint.setAttribute('data-visible', 'true');
      }, 8000);
    </script>
    <style>
      /* Boot splash that always renders, even before Tailwind/JS finish loading.
         Uses only built-in fonts and inline colors so it renders even on cold-cache CN networks. */
      html, body { margin: 0; padding: 0; }
      body { background: #F9F8F6; color: #2C2A26; }
      #boot-splash {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #F9F8F6 0%, #F2F0EB 100%);
        color: #2C2A26;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Georgia, "Playfair Display", "Times New Roman", serif;
        z-index: 9999;
        padding: 1.5rem;
        text-align: center;
      }
      #boot-splash[hidden] { display: none; }
      #boot-splash .boot-mark {
        font-size: 0.7rem;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #4A463F;
        opacity: 0.7;
        margin-bottom: 1.25rem;
      }
      #boot-splash .boot-title {
        font-size: clamp(2rem, 6vw, 3.5rem);
        letter-spacing: -0.02em;
        margin: 0 0 1.75rem 0;
        font-weight: 600;
      }
      #boot-splash .boot-title em { font-style: italic; font-weight: 400; }
      #boot-splash .boot-dots { display: inline-flex; gap: 0.5rem; }
      #boot-splash .boot-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2C2A26;
        opacity: 0.3;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot-splash .boot-dots span:nth-child(2) { animation-delay: 0.2s; }
      #boot-splash .boot-dots span:nth-child(3) { animation-delay: 0.4s; }
      #boot-slow-hint {
        margin-top: 2rem;
        max-width: 32rem;
        font-family: system-ui, -apple-system, "Segoe UI", "Inter", sans-serif;
        font-size: 0.875rem;
        color: #4A463F;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #boot-slow-hint[data-visible="true"] { opacity: 1; }
      #boot-error {
        margin-top: 2rem;
        max-width: 36rem;
        padding: 1.25rem 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", "Inter", sans-serif;
        font-size: 0.9rem;
        color: #7C2D12;
        background: rgba(254, 226, 226, 0.55);
        border: 1px solid rgba(252, 165, 165, 0.55);
        border-radius: 0.5rem;
        text-align: left;
      }
      #boot-error[hidden] { display: none; }
      #boot-error h2 {
        margin: 0 0 0.5rem 0;
        font-family: Georgia, serif;
        font-size: 1.1rem;
        color: #7C2D12;
      }
      #boot-error button {
        margin-top: 0.75rem;
        padding: 0.5rem 1.5rem;
        background: #2C2A26;
        color: #F9F8F6;
        border: none;
        border-radius: 9999px;
        font-family: Georgia, serif;
        cursor: pointer;
        font-size: 0.875rem;
      }
      #boot-error details {
        margin-top: 0.75rem;
        font-size: 0.75rem;
        color: #4A463F;
      }
      #boot-error details pre {
        margin-top: 0.5rem;
        max-height: 12rem;
        overflow: auto;
        padding: 0.5rem;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 0.25rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      @keyframes boot-pulse {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body class="bg-museum-50 text-museum-900 antialiased selection:bg-stone-200">
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-mark">Sophia's Dialectic Engine</div>
      <h1 class="boot-title">Sophia's <em>Dialectic</em></h1>
      <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <p id="boot-slow-hint">看起来网络较慢，正在尝试加载界面…如果长时间停留在这里，可以刷新页面再试。</p>
      <div id="boot-error" hidden>
        <h2>页面加载失败</h2>
        <p>可能是网络问题或脚本加载受阻。可以尝试刷新；如果反复出现，请把下方错误信息提供给开发者。</p>
        <button type="button" onclick="window.location.reload()">重新加载</button>
        <details>
          <summary>查看详细错误</summary>
          <pre id="boot-error-detail"></pre>
        </details>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
