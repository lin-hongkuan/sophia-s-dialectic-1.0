name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: true
          SOPHIA_API_KEY: ${{ secrets.SOPHIA_API_KEY }}
          SOPHIA_API_BASE_URL: ${{ vars.SOPHIA_API_BASE_URL || 'https://api.linhongkuan.com/v1' }}
          SOPHIA_API_MODEL: ${{ vars.SOPHIA_API_MODEL || 'gpt-5.4-mini' }}
          SOPHIA_IMAGE_MODEL: ${{ vars.SOPHIA_IMAGE_MODEL || 'gpt-image-2' }}
          SOPHIA_IMAGE_SIZE: ${{ vars.SOPHIA_IMAGE_SIZE || '1024x1024' }}
          SOPHIA_IMAGE_ASPECT_HINT: ${{ vars.SOPHIA_IMAGE_ASPECT_HINT || 'portrait 1:1.2 aspect ratio' }}
          SOPHIA_API_PROVIDER: ${{ vars.SOPHIA_API_PROVIDER || 'OpenAI-compatible' }}
          SOPHIA_PRESET_GPT_MODEL: ${{ vars.SOPHIA_PRESET_GPT_MODEL }}
          SOPHIA_PRESET_MIMO_MODEL: ${{ vars.SOPHIA_PRESET_MIMO_MODEL }}
          SOPHIA_PRESET_GROK_MODEL: ${{ vars.SOPHIA_PRESET_GROK_MODEL }}

      - name: Preserve custom domain
        run: echo 'dialectic.us.ci' > dist/CNAME

      - name: Deploy dist to gh-pages branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/sophia-pages-deploy
          mkdir -p /tmp/sophia-pages-deploy
          cp -a dist/. /tmp/sophia-pages-deploy/
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout --force gh-pages
            git reset --hard origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/sophia-pages-deploy/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy: publish GitHub Pages" || echo "No changes to deploy"
          git push origin gh-pages --force
