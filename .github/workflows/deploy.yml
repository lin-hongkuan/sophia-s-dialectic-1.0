name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: true
          SOPHIA_API_KEY: ${{ secrets.SOPHIA_API_KEY }}
          SOPHIA_API_BASE_URL: ${{ vars.SOPHIA_API_BASE_URL || 'https://api.linhongkuan.com/v1' }}
          SOPHIA_API_MODEL: ${{ vars.SOPHIA_API_MODEL || 'gpt-5.4-mini' }}
          SOPHIA_IMAGE_MODEL: ${{ vars.SOPHIA_IMAGE_MODEL || 'grok-imagine-image-lite' }}
          SOPHIA_API_PROVIDER: ${{ vars.SOPHIA_API_PROVIDER || 'OpenAI-compatible' }}
          SOPHIA_PRESET_GPT_MODEL: ${{ vars.SOPHIA_PRESET_GPT_MODEL }}
          SOPHIA_PRESET_MIMO_MODEL: ${{ vars.SOPHIA_PRESET_MIMO_MODEL }}
          SOPHIA_PRESET_GROK_MODEL: ${{ vars.SOPHIA_PRESET_GROK_MODEL }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
